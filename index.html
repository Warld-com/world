<!doctype html>
<html lang="en" style="background-color: #000000; color: #ffffff;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>warld</title>
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="ekHyFxotj08S1-8xlbKnmFJ9oZRURBY4ChRPOYhiLpw" />
    <!-- Google Identity Services for seamless Google Sign-In & Auth permissions -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      html, body {
        background-color: #000000 !important;
        color: #ffffff !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #app-preloader {
        position: fixed;
        inset: 0;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
      }
      .preloader-logo {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        object-fit: cover;
        box-shadow: 0 0 40px rgba(255, 75, 145, 0.35);
        margin-bottom: 20px;
      }
      .preloader-title {
        font-size: 28px;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
      }
      .preloader-spinner {
        width: 24px;
        height: 24px;
        border: 2.5px solid rgba(255, 255, 255, 0.15);
        border-top-color: #FF4B91;
        border-radius: 50%;
        animation: preloader-spin 0.8s linear infinite;
        margin-top: 16px;
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body style="background-color: #000000; color: #ffffff;">
    <div id="root">
      <div id="app-preloader">
        <img class="preloader-logo" src="./logo.png" alt="warld logo" />
        <div class="preloader-title">warld</div>
        <div class="preloader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          try {
            var swUrl = new URL('sw.js', window.location.href).href;
            var scopeUrl = new URL('./', window.location.href).href;
            navigator.serviceWorker.register(swUrl, { scope: scopeUrl })
              .then(function(reg) {
                console.log('Service Worker registered with scope:', reg.scope);
              })
              .catch(function(err) {
                console.warn('Relative scope SW registration, fallback to ./sw.js:', err);
                navigator.serviceWorker.register('./sw.js').catch(function() {});
              });
          } catch (e) {
            navigator.serviceWorker.register('./sw.js').catch(function() {});
          }
        });
      }
    </script>
    <!-- Cloudflare analytics script removed to prevent cross-origin Script errors in iframe -->
  </body>
</html>
